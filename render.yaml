# Deploy sem terminal.
#
# A Render lê este arquivo, cria o banco, cria a aplicação, aplica as migrations
# e gera os segredos sozinha. Quem instala não escreve um comando.
#
# O worker roda DENTRO da aplicação (RUN_WORKER_IN_PROCESS), porque um segundo
# serviço custaria dinheiro e é justamente o que faz campanha ficar "em execução"
# sem nada sair quando falta.
#
# CONSEQUÊNCIA DO PLANO GRATUITO: a Render hiberna o serviço depois de alguns
# minutos sem acesso, e o worker hiberna junto. Para um teste com uma mensagem
# não muda nada — quem está testando está com a tela aberta. Para uma campanha
# grande, o serviço precisa ficar de pé: plano pago, ou o worker rodando em
# outro lugar apontando para o mesmo banco.

databases:
  - name: eclizium-banco
    databaseName: eclizium
    user: eclizium
    plan: free

services:
  - type: web
    name: eclizium-outreach
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/eclizium-outreach
    # `migrate deploy` aplica o que existe. Nunca `migrate dev` nem `reset`.
    buildCommand: npm ci && npm run db:deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eclizium-banco
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: eclizium-banco
          property: connectionString
      # Gerados pela Render, nunca versionados nem vistos por ninguém.
      - key: AUTH_SECRET
        generateValue: true
      - key: WORKER_TOKEN
        generateValue: true
      - key: RUN_WORKER_IN_PROCESS
        value: 'true'
      - key: NODE_VERSION
        value: '22'
      - key: META_GRAPH_API_VERSION
        value: v21.0
      # Este não vem da Meta: é uma string que VOCÊ inventa e informa a ela no
      # cadastro do webhook. Gerar aqui evita pedir ao instalador um valor que
      # ele teria de imaginar. Copie o valor gerado no painel da hospedagem e
      # cole no campo "Token de verificação" da Meta.
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      #
      # O QUE NÃO ENTRA AQUI, E POR QUÊ
      #
      # Token de acesso, WABA ID e Phone Number ID são preenchidos dentro do
      # produto, em Configurações > Integrações: ficam cifrados no banco e são
      # por workspace (ADR 0011). Pedi-los neste arquivo abriria campos em
      # branco na criação do serviço, para valores que ninguém tem ainda — e é
      # aí que a instalação trava.
      #
      # META_APP_SECRET vem da Meta e não pode ser gerado. Ele é do APP, não do
      # workspace, então não cabe na tela de Integrações; acrescente-o depois
      # nas variáveis de ambiente da hospedagem. Sem ele a rota de webhook
      # RECUSA toda entrega em vez de aceitar sem verificar assinatura — o
      # envio funciona, mas status de entrega e respostas não chegam.
