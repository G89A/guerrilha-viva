# Ambiente do Codespaces: aplicação + PostgreSQL.
#
# O banco vive num serviço separado com volume próprio, então parar e voltar o
# Codespaces não perde os dados.

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eclizium?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@db:5432/eclizium?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/eclizium_test?schema=public

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eclizium
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
